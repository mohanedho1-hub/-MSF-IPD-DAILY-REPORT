name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip MSF_IPD_DAILY_REPORT_phone_build.zip -d extracted
          cd extracted/MSF_IPD_DAILY_REPORT
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-IPD-DAILY-REPORT-APK
          path: extracted/MSF_IPD_DAILY_REPORT/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
