name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        run: unzip MSF_IPD_DAILY_REPORT_source.zip -d extracted
      - name: Fix JVM target
        run: |
          cat >> extracted/MSF_IPD_DAILY_REPORT/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
      - name: Build debug APK
        run: cd extracted/MSF_IPD_DAILY_REPORT && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSF-IPD-DAILY-REPORT-APK
          path: extracted/MSF_IPD_DAILY_REPORT/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
